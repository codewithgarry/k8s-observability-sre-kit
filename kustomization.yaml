apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - demo-app/podinfo.yaml
  - alerts/workloads.yaml
  - alerts/nodes.yaml
  - alerts/slo-podinfo.yaml

# Grafana's dashboard sidecar loads any ConfigMap labelled grafana_dashboard=1.
configMapGenerator:
  - name: grafana-dashboard-slo-podinfo
    namespace: monitoring
    files:
      - dashboards/slo-podinfo.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true

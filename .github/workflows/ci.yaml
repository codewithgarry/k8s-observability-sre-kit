name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: "2.54.1"
  KUBECONFORM_VERSION: "0.6.7"

jobs:
  rules:
    name: alert rules (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install promtool
        run: |
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"

      # yq (mikefarah) is preinstalled on GitHub-hosted Ubuntu runners
      - name: Check and unit-test rules
        run: make check test

  manifests:
    name: manifests (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate kustomize output
        run: make validate

      - name: Validate dashboard JSON
        run: |
          for f in dashboards/*.json; do
            jq empty "$f" && echo "valid JSON: $f"
          done

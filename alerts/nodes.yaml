apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sre-kit-nodes
  namespace: monitoring
spec:
  groups:
    - name: sre-kit.nodes
      rules:
        - alert: NodeDiskWillFillIn24h
          expr: |
            predict_linear(node_filesystem_avail_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs", mountpoint!~"/boot.*"}[6h], 24 * 3600) < 0
            and
            node_filesystem_avail_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs", mountpoint!~"/boot.*"}
              / node_filesystem_size_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs", mountpoint!~"/boot.*"} < 0.15
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.mountpoint }} will fill up within 24 hours"
            description: "Less than 15% free and the 6-hour trend reaches zero within a day."
            runbook_url: https://github.com/codewithgarry/k8s-observability-sre-kit/blob/main/runbooks/node-disk-pressure.md

        - alert: NodeDiskAlmostFull
          expr: |
            node_filesystem_avail_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs", mountpoint!~"/boot.*"}
              / node_filesystem_size_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs", mountpoint!~"/boot.*"} < 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.mountpoint }} has less than 5% space left"
            description: "Kubelet will start evicting pods (DiskPressure) soon. Act now."
            runbook_url: https://github.com/codewithgarry/k8s-observability-sre-kit/blob/main/runbooks/node-disk-pressure.md

        - alert: NodeMemoryHigh
          expr: |
            1 - node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"} > 0.90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} memory usage is above 90%"
            description: "Sustained memory pressure increases the risk of OOM kills and evictions."
            runbook_url: https://github.com/codewithgarry/k8s-observability-sre-kit/blob/main/runbooks/pod-crashloopbackoff.md#oomkilled

# Values for prometheus-community/kube-prometheus-stack (tested with chart 65.x).

# The default app and node alerts are replaced by the tuned, runbook-linked rules in alerts/.
defaultRules:
  rules:
    kubernetesApps: false
    nodeExporterAlerting: false

prometheus:
  prometheusSpec:
    # Pick up every PrometheusRule / ServiceMonitor, not only ones labelled with the Helm release.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 30d            # long enough to evaluate a 30-day SLO window
    retentionSize: 18GB
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

grafana:
  adminPassword: change-me   # override with --set grafana.adminPassword=... or an existing secret
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

alertmanager:
  alertmanagerSpec:
    # Secret with key "webhook-url", created by scripts/install.sh
    secrets: ["alertmanager-slack"]
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: ticket
      group_by: [alertname, namespace, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        - receiver: pager
          matchers: ['severity = "critical"']
          repeat_interval: 1h
        - receiver: ticket
          matchers: ['severity = "warning"']
    inhibit_rules:
      # A critical alert silences the matching warning for the same target.
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity = "warning"']
        equal: [alertname, namespace, service]
    receivers:
      - name: "null"
      - name: pager
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#oncall-page"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              {{ end }}
      - name: ticket
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#oncall-tickets"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              {{ end }}
